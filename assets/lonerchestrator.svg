<line x1="986" y1="158.0" x2="1016" y2="158.0" class="base"/><line x1="986" y1="158.0" x2="1016" y2="158.0" class="stream" filter="url(#soft)"/><polygon points="1015,152.0 1024,158.0 1015,164.0" fill="#26d970"/>
