<path d="M918.0 208 V242 H570.0 V217" fill="none" class="stream" stroke-opacity=".75" filter="url(#soft)"/>
<polygon points="564.0,218 570.0,209 576.0,218" fill="#26d970"/>
<text class="mono" x="744.0" y="268" font-size="14" fill="#8b99ae" text-anchor="middle">fix · 3 attempts max, then NEEDS YOU</text>
<text class="mono" x="600.0" y="308" font-size="14" fill="#738095" text-anchor="middle">guardrails in code, not prompts · whoever builds never reviews · never deploys</text>
