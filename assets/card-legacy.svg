<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" role="img" aria-label="Legacy Modernization with AI: .NET Framework 4 and WebForms to .NET 10 and React, with AI agents and human review of every change">
<title>Legacy Modernization with AI: .NET Framework 4 and WebForms to .NET 10 and React, with AI agents and human review of every change</title>
<defs>
<style>
.mono{font-family:'Cascadia Code','JetBrains Mono','IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.sans{font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.rain{font-family:'MS Gothic','Yu Gothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace}
.col{animation:fall linear infinite}
.cur{animation:blink 1.06s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.base{stroke:#fff;stroke-opacity:.12;stroke-width:2}
.stream{stroke:#26d970;stroke-width:2.2;stroke-dasharray:8 18;stroke-linecap:round;animation:flow 1.6s linear infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{from{stroke-dashoffset:52}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#26d970" stroke-opacity=".05"/>
</pattern>
<filter id="soft" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cardclip"><rect width="600" height="410" rx="16"/></clipPath>
</defs>
