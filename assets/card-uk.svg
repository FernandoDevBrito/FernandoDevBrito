<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" role="img" aria-label="UK Police Analytics API: async FastAPI service that aggregates UK Police crime data with Pandas and maps it on a Leaflet dashboard">
<title>UK Police Analytics API: async FastAPI service that aggregates UK Police crime data with Pandas and maps it on a Leaflet dashboard</title>
<defs>
<style>
.mono{font-family:'Cascadia Code','JetBrains Mono','IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.sans{font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.rain{font-family:'MS Gothic','Yu Gothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace}
.col{animation:fall linear infinite}
.cur{animation:blink 1.06s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.base{stroke:#fff;stroke-opacity:.12;stroke-width:2}
.stream{stroke:#26d970;stroke-width:2.2;stroke-dasharray:8 18;stroke-linecap:round;animation:flow 1.6s linear infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{from{stroke-dashoffset:52}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#26d970" stroke-opacity=".05"/>
</pattern>
<filter id="soft" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cardclip"><rect width="600" height="410" rx="16"/></clipPath>
</defs>
<g clip-path="url(#cardclip)">
<rect width="600" height="410" fill="#13131a"/>
<rect width="600" height="206" fill="#0a0a0f"/>
<rect width="600" height="206" fill="url(#grid)"/>
<line x1="0" y1="206" x2="600" y2="206" stroke="#fff" stroke-opacity=".06"/>
<rect x="32" y="61" width="120" height="70" rx="8" fill="#0a0a0f" stroke="#26d970" stroke-width="1.2" stroke-opacity=".6"/>
<text class="mono" x="92.0" y="102" font-size="16" font-weight="700" fill="#26d970" text-anchor="middle">Police API</text>
<line x1="152" y1="96" x2="190" y2="96" class="base"/><line x1="152" y1="96" x2="190" y2="96" class="stream" filter="url(#soft)"/><polygon points="189,90 198,96 189,102" fill="#26d970"/>
<rect x="198" y="39.0" width="196" height="114" rx="8" fill="#0a0a0f" stroke="#26d970" stroke-width="1.8" stroke-opacity="1"/>
<text class="mono" x="296.0" y="69" font-size="16" font-weight="700" fill="#26d970" text-anchor="middle">FastAPI</text>
<text class="mono" x="296.0" y="95" font-size="14" fill="#738095" text-anchor="middle">HTTPX async</text>
<text class="mono" x="296.0" y="115" font-size="14" fill="#738095" text-anchor="middle">Pandas engine</text>
<text class="mono" x="296.0" y="135" font-size="14" fill="#738095" text-anchor="middle">GeoJSON</text>
<line x1="394" y1="96" x2="432" y2="96" class="base"/><line x1="394" y1="96" x2="432" y2="96" class="stream" filter="url(#soft)"/><polygon points="431,90 440,96 431,102" fill="#26d970"/>
<rect x="440" y="61" width="128" height="70" rx="8" fill="#0a0a0f" stroke="#26d970" stroke-width="1.2" stroke-opacity=".6"/>
<text class="mono" x="504.0" y="91" font-size="16" font-weight="700" fill="#26d970" text-anchor="middle">Dashboard UI</text>
<text class="mono" x="504.0" y="117" font-size="14" fill="#738095" text-anchor="middle">Leaflet map</text>
<text class="mono" x="32" y="240" font-size="13" letter-spacing="1.4" fill="#26d970">BACKEND · ANALYTICS · LIVE DEMO</text>
<text class="sans" x="32" y="274" font-size="26" font-weight="700" fill="#eef2f7">UK Police Analytics API</text>
<text class="sans" x="32" y="306" font-size="16.5" fill="#8b99ae">Async FastAPI service that consumes the official</text>
<text class="sans" x="32" y="329" font-size="16.5" fill="#8b99ae">UK Police API, aggregates crime data with Pandas</text>
<text class="sans" x="32" y="352" font-size="16.5" fill="#8b99ae">and maps it on a Leaflet dashboard.</text>
<rect x="32" y="372" width="67" height="26" rx="6" fill="#fff" fill-opacity=".04" stroke="#26d970" stroke-opacity=".25"/><text class="mono" x="65" y="390" font-size="13" fill="#eef2f7" text-anchor="middle">Python</text>
<rect x="106.8" y="372" width="75" height="26" rx="6" fill="#fff" fill-opacity=".04" stroke="#26d970" stroke-opacity=".25"/><text class="mono" x="144" y="390" font-size="13" fill="#eef2f7" text-anchor="middle">FastAPI</text>
<rect x="189.39999999999998" y="372" width="59" height="26" rx="6" fill="#fff" fill-opacity=".04" stroke="#26d970" stroke-opacity=".25"/><text class="mono" x="219" y="390" font-size="13" fill="#eef2f7" text-anchor="middle">HTTPX</text>
<rect x="256.4" y="372" width="67" height="26" rx="6" fill="#fff" fill-opacity=".04" stroke="#26d970" stroke-opacity=".25"/><text class="mono" x="290" y="390" font-size="13" fill="#eef2f7" text-anchor="middle">Pandas</text>
<rect x=".5" y=".5" width="599" height="409" rx="15.5" fill="none" stroke="#26d970" stroke-opacity=".2"/>
</g>
</svg>
